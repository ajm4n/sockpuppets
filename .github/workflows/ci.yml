name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.txt
          pip install fastapi httpx

      - name: Run regression tests
        run: |
          python -m pytest tests/test_regression_*.py -v --tb=short

      - name: Run server tests
        run: |
          python -m pytest tests/test_gui_api.py \
                           tests/test_obfuscators.py \
                           -v --tb=short

  rust-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check Rust agent source patterns
        working-directory: agent_rust
        run: |
          # Template placeholders prevent compilation, so verify source patterns
          grep -q '__fs:ls:' src/main.rs
          grep -q '__fs:get:' src/main.rs
          grep -q '__fs:put:' src/main.rs
          grep -q '__fs:ls:' src/lib.rs
          grep -q '__fs:get:' src/lib.rs
          grep -q '__fs:put:' src/lib.rs
          grep -q 'sockpuppets-salt-v1' src/main.rs
          grep -q 'sockpuppets-handshake-v1' src/main.rs
          grep -q 'sockpuppets-session-v1' src/main.rs
          grep -q 'EPH1\.' src/main.rs
          grep -q 'EPH2\.' src/main.rs
          grep -q 'AES1' src/main.rs
          grep -q '__kill' src/main.rs
          grep -q '__set_interval:' src/main.rs
          echo "Rust agent source patterns verified"

  go-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Check Go agent source patterns
        run: |
          grep -q '__fs:ls:' agent_go/agent.go
          grep -q 'sockpuppets-salt-v1' agent_go/wire_session.go || grep -q 'sockpuppets-salt-v1' agent_go/agent.go
          grep -q 'EPH1\.' agent_go/wire_session.go || grep -q 'EPH1\.' agent_go/agent.go
          grep -q '__kill' agent_go/agent.go
          grep -q '__set_interval:' agent_go/agent.go
          echo "Go agent source patterns verified"

  c-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check C agent source patterns
        run: |
          grep -q '__fs:' agent_c/agent.c
          grep -q '__fs:ls:' agent_c/agent.c
          grep -q 'sockpuppets-salt-v1' agent_c/agent.c
          grep -q 'sockpuppets-handshake-v1' agent_c/agent.c
          grep -q 'EPH1\.' agent_c/agent.c
          grep -q '__kill' agent_c/agent.c
          grep -q '__set_interval:' agent_c/agent.c
          echo "C agent source patterns verified"

  csharp-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check C# agent source patterns
        run: |
          grep -q 'sockpuppets-salt-v1' agent_csharp/Eph1.cs
          grep -q 'sockpuppets-handshake-v1' agent_csharp/Eph1.cs
          grep -q 'EPH1\.' agent_csharp/Eph1.cs
          grep -q 'new BigInteger(ub)' agent_csharp/Eph1.cs
          grep -q 'DllImport("bcrypt.dll"' agent_csharp/Eph1.cs
          grep -q 'CharSet.Unicode' agent_csharp/Eph1.cs
          grep -q '"AES"' agent_csharp/Eph1.cs
          echo "C# agent source patterns verified"

  powershell-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check PowerShell template patterns
        run: |
          grep -q '__fs:ls:' templates/agent_http_template.ps1
          grep -q '__fs:get:' templates/agent_http_template.ps1
          grep -q '__fs:put:' templates/agent_http_template.ps1
          grep -q 'Invoke-NativeLs' templates/agent_http_template.ps1
          grep -q 'sockpuppets-salt-v1' templates/agent_http_template.ps1
          grep -q 'sockpuppets-handshake-v1' templates/agent_http_template.ps1
          grep -q 'EPH1\.' templates/agent_http_template.ps1
          grep -q '(,\$ub)' templates/agent_http_template.ps1
          grep -q 'BCryptOpenAlgorithmProvider' templates/agent_http_template.ps1
          grep -q '__kill' templates/agent_http_template.ps1
          grep -q '__set_interval:' templates/agent_http_template.ps1
          echo "PowerShell template patterns verified"
